logging:
  console:
    enabled: true
    level: info
    format: json
  file:
    enabled: false
    name: web
    level: debug
    format: json
    folder: .logs
    max_size: 10
    max_age: 7
    max_backups: 10
    compress: false
  version: false

web:
  # The origin browsers use. https makes every cookie Secure and enables HSTS.
  public_url: https://chat.example.com
  trusted_proxies: []
  # The voice servers' signaling origins, as wss://voice.example.com. A
  # voice server under public_url's own host needs none.
  voice_origins: []
  upload_limit: 52428800
  render_cache_size: 20000
  http:
    address: "0.0.0.0:8080"
    read_header_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
    transfer_timeout: 10m
    transfer_idle_timeout: 30s
    max_header_bytes: 16384
    shutdown_timeout: 15s
  rate_limit:
    auth_per_minute: 10
    auth_burst: 10
    requests_per_second: 30
    request_burst: 120

client:
  drpc:
    address: localhost:7070
    gateway_key: ""
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
    dial_timeout: 5s
    write_timeout: 30s
    request_timeout: 15s
    pool_capacity: 64
    pool_expiration: 2m
    max_message_size: 4194304

gateway:
  id: ""
  reconnect_min: 500ms
  reconnect_max: 15s
  read_limit: 65536
  send_buffer: 1048576
  recv_buffer: 262144
  write_timeout: 10s
  ping_interval: 25s
  max_per_user: 20
  frame_rate: 10
  frame_burst: 40
  attach_rate: 200
  attach_burst: 100
  resync_rate: 50
  resync_burst: 50
  resync_jitter: 5s
