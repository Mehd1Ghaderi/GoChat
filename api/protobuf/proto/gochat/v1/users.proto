syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
  // SetPhoto takes a processed photo: see the photo package.
  rpc SetPhoto(SetPhotoRequest) returns (SetPhotoResponse);
  rpc RemovePhoto(RemovePhotoRequest) returns (RemovePhotoResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
}

message UpdateProfileResponse {
  User user = 1;
}

message GetPresenceRequest {
  repeated string user_ids = 1;
}

message GetPresenceResponse {
  repeated string online_user_ids = 1;
}

message SetPhotoRequest {
  bytes image = 1;
}

message SetPhotoResponse {
  User user = 1;
}

message RemovePhotoRequest {}

message RemovePhotoResponse {
  User user = 1;
}
