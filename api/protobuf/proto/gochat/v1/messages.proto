syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";

service MessageService {
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse);
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  rpc SendTyping(SendTypingRequest) returns (SendTypingResponse);
  // ListThread returns a thread's root and its replies.
  rpc ListThread(ListThreadRequest) returns (ListThreadResponse);
  rpc React(ReactRequest) returns (ReactResponse);
}

// ReactRequest adds the caller's reaction, or with remove takes it back.
message ReactRequest {
  string channel_id = 1;
  string message_id = 2;
  string root_id = 3;
  string emoji = 4;
  bool remove = 5;
}

message ReactResponse {
  repeated Reaction reactions = 1;
}

message PostMessageRequest {
  string channel_id = 1;
  string content = 2;
  repeated string attachment_ids = 3;
  // Set to reply in the thread of that root message.
  string root_id = 4;
}

message PostMessageResponse {
  Message message = 1;
}

message EditMessageRequest {
  string channel_id = 1;
  string message_id = 2;
  string content = 3;
  // Set when the message is a reply.
  string root_id = 4;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string channel_id = 1;
  string message_id = 2;
  string root_id = 3;
}

message DeleteMessageResponse {}

message ListMessagesRequest {
  string channel_id = 1;
  // Exclusive upper bound; empty starts at the newest message.
  string before_id = 2;
  uint32 limit = 3;
}

message ListMessagesResponse {
  // Newest first.
  repeated Message messages = 1;
  bool has_more = 2;
}

message GetMessageRequest {
  string channel_id = 1;
  string message_id = 2;
  string root_id = 3;
}

message ListThreadRequest {
  string channel_id = 1;
  string root_id = 2;
  // Exclusive upper bound; empty starts at the newest reply.
  string before_id = 3;
  uint32 limit = 4;
}

message ListThreadResponse {
  Message root = 1;
  // Oldest first.
  repeated Message replies = 2;
  // Whether replies older than the first exist.
  bool has_more = 3;
}

message GetMessageResponse {
  Message message = 1;
}

message SendTypingRequest {
  string channel_id = 1;
}

message SendTypingResponse {}
