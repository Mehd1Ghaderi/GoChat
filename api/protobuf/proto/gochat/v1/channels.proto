syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";

service ChannelService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc BrowseChannels(BrowseChannelsRequest) returns (BrowseChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse);
  rpc AddChannelMember(AddChannelMemberRequest) returns (AddChannelMemberResponse);
  rpc RemoveChannelMember(RemoveChannelMemberRequest) returns (RemoveChannelMemberResponse);
  rpc ListChannelMembers(ListChannelMembersRequest) returns (ListChannelMembersResponse);
  rpc OpenDirectChannel(OpenDirectChannelRequest) returns (OpenDirectChannelResponse);
  rpc MarkChannelRead(MarkChannelReadRequest) returns (MarkChannelReadResponse);
  // A muted channel neither notifies nor shows its unread messages.
  rpc SetChannelMuted(SetChannelMutedRequest) returns (SetChannelMutedResponse);
  rpc ListMutedChannels(ListMutedChannelsRequest) returns (ListMutedChannelsResponse);
  // Lets the channel's members post voice messages, or stops them. Channel
  // and team admins may change it.
  rpc SetChannelVoice(SetChannelVoiceRequest) returns (SetChannelVoiceResponse);
}

message SetChannelVoiceRequest {
  string channel_id = 1;
  bool enabled = 2;
}

message SetChannelVoiceResponse {
  Channel channel = 1;
}

message SetChannelMutedRequest {
  string channel_id = 1;
  bool muted = 2;
}

message SetChannelMutedResponse {}

message ListMutedChannelsRequest {}

message ListMutedChannelsResponse {
  repeated string channel_ids = 1;
}

message ListChannelsRequest {
  // The team's channels the caller belongs to, and every direct channel.
  string team_id = 1;
}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message BrowseChannelsRequest {
  string team_id = 1;
}

message BrowseChannelsResponse {
  // Public channels of the team the caller has not joined.
  repeated Channel channels = 1;
}

message CreateChannelRequest {
  string team_id = 1;
  string name = 2;
  string display_name = 3;
  string purpose = 4;
  ChannelType type = 5;
  // Creates the channel without voice messages, which can be allowed later.
  bool voice_disabled = 6;
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetChannelRequest {
  string channel_id = 1;
}

message GetChannelResponse {
  Channel channel = 1;
}

message JoinChannelRequest {
  string channel_id = 1;
}

message JoinChannelResponse {
  Channel channel = 1;
}

message LeaveChannelRequest {
  string channel_id = 1;
}

message LeaveChannelResponse {}

message AddChannelMemberRequest {
  string channel_id = 1;
  string user_id = 2;
}

message AddChannelMemberResponse {}

message RemoveChannelMemberRequest {
  string channel_id = 1;
  string user_id = 2;
}

message RemoveChannelMemberResponse {}

message ListChannelMembersRequest {
  string channel_id = 1;
}

message ListChannelMembersResponse {
  repeated ChannelMember members = 1;
}

message OpenDirectChannelRequest {
  string user_id = 1;
}

message OpenDirectChannelResponse {
  Channel channel = 1;
}

message MarkChannelReadRequest {
  string channel_id = 1;
  string message_id = 2;
}

message MarkChannelReadResponse {}
