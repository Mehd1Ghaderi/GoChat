org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# iOS targets build on macOS only; elsewhere they are skipped quietly.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 builds Kotlin itself and has a new DSL; the KMP module still uses
# com.android.library with androidTarget(), which these keep working until
# it moves to com.android.kotlin.multiplatform.library.
android.builtInKotlin=false
android.newDsl=false
