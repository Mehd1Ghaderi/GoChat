name: gochat

services:

  scylla:
    image: ${DOCKER_REGISTRY:-docker.io/}scylladb/scylla:2026.1.15
    container_name: gochat-scylla
    restart: unless-stopped
    command:
      - --smp=1
      - --memory=1G
      - --overprovisioned=1
      - --developer-mode=1
      - --authenticator=PasswordAuthenticator
      - --authorizer=CassandraAuthorizer
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - backend

  scylla-init:
    image: ${DOCKER_REGISTRY:-docker.io/}scylladb/scylla:2026.1.15
    container_name: gochat-scylla-init
    entrypoint: ["/bin/sh", "-c"]
    environment:
      SCYLLA_USERNAME: ${DATABASE_SCYLLA_USERNAME}
      SCYLLA_PASSWORD: ${DATABASE_SCYLLA_PASSWORD}
    command:
      - |
        set -e
        cqlsh scylla -u cassandra -p cassandra -e "CREATE ROLE IF NOT EXISTS $$SCYLLA_USERNAME WITH PASSWORD = '$$SCYLLA_PASSWORD' AND LOGIN = true AND SUPERUSER = true;"
    depends_on:
      scylla:
        condition: service_healthy
    networks:
      - backend

  minio:
    image: ${DOCKER_REGISTRY:-docker.io/}pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: gochat-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    image: gochat:latest
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io/}
    container_name: gochat-migrate
    command: ["migrate", "scylla", "up", "/app/migrations/scylla", "--config-path", "/app/config", "--config-name", "migrate"]
    environment:
      DATABASE_SCYLLA_USERNAME: ${DATABASE_SCYLLA_USERNAME}
      DATABASE_SCYLLA_PASSWORD: ${DATABASE_SCYLLA_PASSWORD}
    depends_on:
      scylla-init:
        condition: service_completed_successfully
    networks:
      - backend

  server:
    image: gochat:latest
    container_name: gochat-server
    restart: unless-stopped
    command: ["server", "--config-path", "/app/config", "--config-name", "server"]
    environment:
      DATABASE_SCYLLA_USERNAME: ${DATABASE_SCYLLA_USERNAME}
      DATABASE_SCYLLA_PASSWORD: ${DATABASE_SCYLLA_PASSWORD}
      STORAGE_MINIO_ACCESS_KEY: ${STORAGE_MINIO_ACCESS_KEY}
      STORAGE_MINIO_SECRET_KEY: ${STORAGE_MINIO_SECRET_KEY}
      SERVER_DRPC_GATEWAY_KEY: ${GATEWAY_KEY}
      SERVICES_ACCOUNTS_SECRET_KEY: ${SERVICES_ACCOUNTS_SECRET_KEY}
      SERVICES_ACCOUNTS_SETUP_TOKEN: ${SERVICES_ACCOUNTS_SETUP_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - backend

  web:
    image: gochat:latest
    container_name: gochat-web
    restart: unless-stopped
    command: ["web", "--config-path", "/app/config", "--config-name", "web"]
    environment:
      CLIENT_DRPC_GATEWAY_KEY: ${GATEWAY_KEY}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      WEB_TRUSTED_PROXIES: ${WEB_TRUSTED_PROXIES:-}
    # The default only accepts connections from this machine, such as a
    # TLS-terminating proxy or tunnel there.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      server:
        condition: service_healthy
    networks:
      - backend
      - frontend

volumes:
  scylla_data:
  minio_data:

networks:
  backend:
    internal: true
  frontend:
