# Publishes the stores on the host, for running the server and the web
# gateway outside of docker during development. Scylla then advertises
# 127.0.0.1, so only clients on the host can use it.
services:
  scylla:
    command:
      - --smp=1
      - --memory=1G
      - --overprovisioned=1
      - --developer-mode=1
      - --authenticator=PasswordAuthenticator
      - --authorizer=CassandraAuthorizer
      - --rpc-address=0.0.0.0
      - --broadcast-rpc-address=127.0.0.1
    ports:
      - "127.0.0.1:9042:9042"
    networks:
      - backend
      - dev

  minio:
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    networks:
      - backend
      - dev

networks:
  dev:
