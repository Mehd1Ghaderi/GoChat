{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eeedf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e2033" media="(prefers-color-scheme: dark)">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"refreshOnHistoryMiss":true,"selfRequestsOnly":true,"scrollIntoViewOnBoost":false}'>
<title>{{with .Title}}{{.}} · {{end}}GoChat</title>
<link rel="icon" href="{{static "icon.svg"}}" type="image/svg+xml">
<link rel="stylesheet" href="{{static "app.css"}}">
<script src="{{static "sidebar.js"}}"></script>
<script src="{{static "htmx.min.js"}}" defer></script>
<script src="{{static "ws.min.js"}}" defer></script>
<script src="{{static "app.js"}}" defer></script>
<script src="{{static "voice.js"}}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'>
{{template "content" .}}
</body>
</html>{{end}}
