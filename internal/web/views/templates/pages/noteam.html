{{define "content"}}
<main class="auth">
  <div class="auth-card">
    <div class="brand"><img src="{{static "icon.svg"}}" alt="" width="40" height="40"><span>GoChat</span></div>
    {{if .CanCreate}}
    <h1>Create a team</h1>
    <p class="muted">Teams hold channels and people. You can invite others once it exists.</p>
    {{with .Error}}<p class="alert" role="alert">{{.}}</p>{{end}}
    <form method="post" action="/teams" class="stack">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <label>Team name
        <input name="display_name" required maxlength="64" value="{{.Form.DisplayName}}" autofocus>
      </label>
      <label>URL name
        <input name="name" required minlength="2" maxlength="50" pattern="[a-z0-9][a-z0-9\-]{1,49}" value="{{.Form.Name}}">
        <small>Lowercase letters, digits and '-'. It appears in links.</small>
      </label>
      <label>Description
        <input name="description" maxlength="250" value="{{.Form.Description}}">
      </label>
      <button class="btn primary block" type="submit">Create team</button>
    </form>
    {{else}}
    <h1>No team yet</h1>
    <p class="muted">Ask a team admin for an invite link.</p>
    {{end}}
    {{if .HasTeams}}<p class="center"><a href="/">Back to my teams</a></p>{{end}}
    <form method="post" action="/logout" class="center">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button class="link" type="submit">Sign out</button>
    </form>
  </div>
</main>
{{end}}
