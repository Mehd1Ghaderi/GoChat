{{define "content"}}
<div class="shell" hx-ext="ws" ws-connect="/ws">
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
  <aside class="sidebar" aria-label="Navigation">
    {{template "team-rail" .}}
    <div class="sidebar-main">
      <header class="team-header">
        <div class="team-name" title="{{.Team.DisplayName}}">{{.Team.DisplayName}}</div>
        <details class="menu">
          <summary class="icon-btn" aria-label="Team menu">⋯</summary>
          <div class="menu-items">
            {{if isAdmin .Team}}<button hx-get="/t/{{.Team.Name}}/invite" hx-target="#modal">Invite people</button>{{end}}
            <button hx-get="/t/{{.Team.Name}}/members" hx-target="#modal">Team members</button>
            <button hx-get="/t/{{.Team.Name}}/channels/new" hx-target="#modal">Create a channel</button>
            <button hx-get="/t/{{.Team.Name}}/channels/browse" hx-target="#modal">Browse channels</button>
            <a href="/settings">Account settings</a>
          </div>
        </details>
      </header>
      {{template "channel-lists" .Lists}}
      <footer class="me">
        <span class="avatar sm {{avatar .User}}" aria-hidden="true">{{initials .User}}</span>
        <span class="me-name"><strong>{{name .User}}</strong><small>@{{.User.Username}}</small></span>
        <a class="icon-btn" href="/settings" aria-label="Settings" title="Settings">⚙</a>
        <form method="post" action="/logout">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <button class="icon-btn" type="submit" aria-label="Sign out" title="Sign out">⏻</button>
        </form>
      </footer>
    </div>
  </aside>
  <label for="nav-toggle" class="scrim" aria-hidden="true"></label>
  <main id="main" class="main">
    {{template "channel" .Channel}}
  </main>
  <div id="modal"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="ws-control" hidden></div>
</div>
{{end}}
