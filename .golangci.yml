version: "2"
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
linters:
  default: standard
  enable:
    - misspell
    - gosec
    - asciicheck
    - dupword
    - copyloopvar
    - durationcheck
    - errorlint
    - nolintlint
    - perfsprint
    - predeclared
    - unconvert
    - usestdlibvars
    - wastedassign
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
    paths:
      - ^api/protobuf/gen/.*$
      - ^playground/.*$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ssenerg/gochat
  exclusions:
    paths:
      - ^api/protobuf/gen/.*$
