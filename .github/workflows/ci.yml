name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories turn up without any change here.
  schedule:
    - cron: "23 5 * * 1"
  # Run on main, it tests and deploys again.
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait for each other instead of cutting off a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - name: Test
        run: go test -race -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Builds the image and runs the end-to-end suite against the whole stack.
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file .env --file deployments/docker/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Settings
        run: |
          # Scylla needs more asynchronous I/O than the runner allows.
          sudo sysctl -w fs.aio-max-nr=1048576
          (umask 077 && cat > .env <<EOF
          DOCKER_REGISTRY=docker.io/
          DATABASE_SCYLLA_USERNAME=gochat
          DATABASE_SCYLLA_PASSWORD=$(openssl rand -hex 24)
          STORAGE_MINIO_ACCESS_KEY=gochat
          STORAGE_MINIO_SECRET_KEY=$(openssl rand -hex 24)
          GATEWAY_KEY=$(openssl rand -hex 32)
          SERVICES_ACCOUNTS_SECRET_KEY=$(openssl rand -base64 32)
          WEB_PUBLIC_URL=http://localhost:8080
          WEB_PORT=8080
          EOF
          )
          echo "GOCHAT_E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Compose file
        run: $COMPOSE config --quiet
      - name: Stack
        run: $COMPOSE up --detach --build --wait --wait-timeout 600
      - name: End-to-end
        env:
          GOCHAT_E2E_URL: http://localhost:8080
          GOCHAT_E2E_ADMIN: admin
          GOCHAT_E2E_TEAM: acme
          GOCHAT_E2E_BOOTSTRAP: "1"
        run: go test -count=1 -v ./test/e2e
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

  # Sends the image to the server over SSH, where deployments/docker/deploy.sh
  # starts it, for every push to main that passes. See "Deploying" in the
  # README for the settings of the production environment.
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/apps/gochat' }}
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
    steps:
      - name: Settings
        id: settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Not deployed: the production environment needs the secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see Deploying in the README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # It is quoted in remote commands.
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eqx '/[A-Za-z0-9._/-]+'; then
            echo "::error::DEPLOY_PATH must be an absolute path of letters, digits and . _ - /"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image
        if: steps.settings.outputs.ready == 'true'
        run: |
          docker build --pull --platform "$DEPLOY_PLATFORM" --tag gochat:latest \
            --file deployments/docker/Dockerfile \
            --label org.opencontainers.image.title=gochat \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: SSH
        if: steps.settings.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 15
          EOF
      - name: Deploy
        if: steps.settings.outputs.ready == 'true'
        run: |
          tar -cf - -C deployments/docker docker-compose.yml deploy.sh |
            ssh server "mkdir -p '$DEPLOY_PATH' && tar -xf - -C '$DEPLOY_PATH'"
          docker save gochat:latest | gzip | ssh server "sh '$DEPLOY_PATH/deploy.sh'"
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
